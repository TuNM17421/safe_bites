packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 build-script approvals (`allowBuilds`). All are trusted prebuild/codegen deps: esbuild
# (vitest/vite), sharp (Next image), prisma engines/client (codegen), and @swc/core + @parcel/watcher
# (Next 16 toolchain; ship platform prebuilds).
allowBuilds:
  esbuild: true
  sharp: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@parcel/watcher': true
