packages:
  - "apps/*"
  - "packages/*"

# Prebuilt-binary / codegen deps that need their install script approved under pnpm's
# secure-by-default build policy: esbuild (vitest/vite), sharp (Next image optimizer),
# prisma engines/client (query-engine binary + client codegen).
allowBuilds:
  esbuild: true
  sharp: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
