<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SafeBite Travel</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        padding: 1.5rem;
      }
      main { max-width: 32rem; }
      h1, h2 { margin: 0 0 0.5rem; font-size: 1.35rem; }
      p { margin: 0 0 1rem; color: #cbd5e1; line-height: 1.5; }
      hr { border: none; border-top: 1px solid #334155; margin: 1.5rem 0; }
      a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: #f1f5f9;
        color: #0f172a;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Showing saved information only. Please confirm with restaurant staff before ordering.</p>
      <hr />
      <h2 lang="vi">Bạn đang ngoại tuyến</h2>
      <p lang="vi">Chỉ hiển thị thông tin đã lưu. Vui lòng xác nhận với nhân viên nhà hàng trước khi gọi món.</p>
      <a href="/home">Retry · Thử lại</a>
    </main>
  </body>
</html>
